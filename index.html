<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <title>3 в ряд — с анимацией</title>
    <style>
        body {
            background: #111 url('assets/background.jpg') center top / cover no-repeat;
            min-height: 100vh;
            margin: 0;
            touch-action: none;
            user-select: none;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            flex-direction: column;
            padding-top: clamp(170px, 28vh, 230px);
            box-sizing: border-box;
        }

        #score {
            color: #fff;
            font: 700 30px/1 Arial, sans-serif;
            text-shadow: 0 2px 0 rgba(0, 0, 0, 0.25);
            margin-bottom: 18px;
            z-index: 10;
        }

        canvas {
            background: transparent;
            border-radius: 14px;
            touch-action: none;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div id="score">Счёт: 0</div>
    <canvas id="game" width="360" height="360"></canvas>

    <script src="game.js"></script>
</body>

</html>
